[package]
name = "arcman-gui"
version = "0.2.0"
edition = "2021"
description = "Gestor de paquetes para Arch Linux con interfaz gráfica (Iced)"
license = "MIT"

[dependencies]
iced = { version = "0.12", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
lto = true
strip = true
opt-level = 3
