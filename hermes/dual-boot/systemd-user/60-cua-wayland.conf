# cua-driver en Wayland (backend experimental) para toda la sesión de usuario.
#
# Lo necesita el backend `serve` que lanza la app de escritorio (hereda el entorno
# de la sesión, no el del gateway): computer_use corre en ese proceso, no en
# systemd. Se aplica al iniciar sesión.
CUA_DRIVER_RS_ENABLE_WAYLAND=1

# Sin esto, Electron solo expone el marco: el árbol AT-SPI queda vacío y no se
# puede pulsar nada por accesibilidad.
ELECTRON_ENABLE_ACCESSIBILITY=1
