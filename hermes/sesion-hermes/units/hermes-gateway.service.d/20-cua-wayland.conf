# cua-driver en Wayland (backend experimental)
# Permite que el control de escritorio de Hermes capture la pantalla por el portal
# XDG y lea el árbol AT-SPI cuando la sesión es Wayland pura (la app de escritorio
# corre con --ozone-platform=wayland). Sin esto, computer_use no ve ventanas.
#
# Ojo: con solo esta variable hay CAPTURA y lectura AX; para pulsar/teclear en
# GNOME hace falta además la extensión WinRects del driver (wayland-helper) y que
# su metadata declare la versión de GNOME instalada.
[Service]
Environment=CUA_DRIVER_RS_ENABLE_WAYLAND=1
Environment=ELECTRON_ENABLE_ACCESSIBILITY=1
