[Service]
# El gateway arranca en default.target, antes de que el wifi tenga ruta y DNS: sin esta espera
# agota sus 8 intentos contra Telegram con «Temporary failure in name resolution» (incluso a las
# IPs literales, porque aún no hay ruta) y deja ~12 WARNING por arranque (766 acumulados entre el
# 28/09 y el 18/10/2026). After=network-online.target no sirve aquí: en systemd de USUARIO ese
# target no espera a la red real. Esta espera (tope 60 s) sale SIEMPRE 0 para no impedir el
# arranque si la red no llegase nunca.
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do if getent hosts api.telegram.org >/dev/null 2>&1 && ip -4 route show default | grep -q .; then exit 0; fi; sleep 2; done; exit 0'
